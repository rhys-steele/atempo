<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Social card source — kept in-repo so it's regenerable.
     Screenshot at 1200×630 → og.png (see Phase 3 in the plan):
       chrome --headless=new --screenshot=og.png --window-size=1200,630 og.html -->
<!-- webfonts (site.css no longer @imports them — they load via <link> on the page) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="../css/site.css">
<style>
  html, body { margin: 0; }
  .og {
    width: 1200px;
    height: 630px;
    box-sizing: border-box;
    background: var(--canvas);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 80px;
    /* a barely-there teal wash from the corner — same espresso, just lifted */
    background-image: radial-gradient(120% 90% at 100% 0%, var(--teal-tint-06), transparent 55%);
  }
  .og__brand { display: flex; align-items: center; gap: 20px; }
  .og__meter { display: inline-flex; align-items: flex-end; gap: 7px; height: 56px; }
  .og__meter span { width: 13px; border-radius: 3px; background: var(--teal-500); }
  .og__word {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 44px;
    color: var(--text-strong);
    letter-spacing: -0.01em;
  }
  .og__headline {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 72px;
    line-height: 1.05;
    letter-spacing: -0.015em;
    color: var(--text-strong);
    max-width: 18ch;
  }
  .og__headline em { font-style: italic; color: var(--accent); }
  .og__foot {
    font-family: var(--font-mono);
    font-size: 20px;
    color: var(--text-muted);
  }
</style>
</head>
<body>
  <div class="og">
    <div class="og__brand">
      <span class="og__meter">
        <span style="height:56px"></span>
        <span style="height:40px"></span>
        <span style="height:49px"></span>
        <span style="height:30px"></span>
      </span>
      <span class="og__word">atempo</span>
    </div>
    <h1 class="og__headline">Come back <em>in&nbsp;tempo</em>, not from a cold start.</h1>
    <p class="og__foot">a flow-state studio for many AI-assisted projects</p>
  </div>
</body>
</html>
