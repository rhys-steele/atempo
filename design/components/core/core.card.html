<!-- @dsCard group="Components" viewport="700x200" subtitle="Button — primary / secondary / accentOutline / ghost" name="Core · Button" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--canvas); padding: 30px; }
  .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 16px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    // Resolve the generated DS namespace without hardcoding it (crash-safe across cross-origin frames).
    function findNS(keys) {
      for (const k of Object.keys(window)) {
        try { const v = window[k]; if (v && typeof v === 'object' && keys.every(kk => kk in v)) return v; } catch (e) {}
      }
      return {};
    }
    const NS = findNS(['Button', 'Badge']);
    const { Button } = NS;
    function Demo() {
      return (
        <>
          <div className="row">
            <Button variant="primary" glyph="▶">Run all — 3 steps</Button>
            <Button variant="secondary">Open app</Button>
            <Button variant="accentOutline" size="sm" glyph="▸">Run</Button>
            <Button variant="ghost" glyph="→">Pick up in code</Button>
          </div>
          <div className="row">
            <Button variant="primary" size="sm" glyph="+">New</Button>
            <Button variant="secondary" size="sm">Resume with Claude</Button>
            <Button variant="secondary" disabled>Disabled</Button>
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
