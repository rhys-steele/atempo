<!-- @dsCard group="Components" viewport="700x210" subtitle="TempoMeter, StatusDot, RuntimePill, Badge" name="Status · tempo & runtime" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="../../vendor/react.production.min.js"></script>
<script src="../../vendor/react-dom.production.min.js"></script>
<script src="../../vendor/babel.min.js"></script>
<!-- StatusDot first: RuntimePill resolves it from the namespace. -->
<script type="text/babel" src="./StatusDot.jsx"></script>
<script type="text/babel" src="./TempoMeter.jsx"></script>
<script type="text/babel" src="./RuntimePill.jsx"></script>
<script type="text/babel" src="../core/Badge.jsx"></script>
<style>
  body { margin: 0; background: var(--canvas); padding: 30px; font-family: var(--font-mono); color: var(--text-muted); }
  .row { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 22px; }
  .cell { display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .lab { font-size: 10px; letter-spacing: 0.12em; color: var(--text-faint); }
  .inline { display: flex; align-items: center; gap: 8px; font-size: 12px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { TempoMeter, StatusDot, RuntimePill, Badge } = window.AtempoDS;
    function Demo() {
      return (
        <>
          <div className="row">
            <div className="cell"><TempoMeter tempo="in" /><span className="lab">IN TEMPO</span></div>
            <div className="cell"><TempoMeter tempo="steady" /><span className="lab">STEADY</span></div>
            <div className="cell"><TempoMeter tempo="cold" /><span className="lab">COLD</span></div>
            <div className="cell"><TempoMeter tempo="in" size="lg" /><span className="lab">LOGO · LG</span></div>
          </div>
          <div className="row">
            <span className="inline"><StatusDot tone="live" live /> live</span>
            <span className="inline"><StatusDot tone="attention" /> attention</span>
            <RuntimePill state="live" label="live :4100 :1420" />
            <RuntimePill state="ready" label="ready — 1 service" />
            <RuntimePill state="bypassed" label="static · skipped" />
            <Badge tone="attention">2 uncommitted</Badge>
          </div>
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
