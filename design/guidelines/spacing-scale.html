<!-- @dsCard group="Spacing" viewport="700x170" subtitle="2px base; rhythm on 8 / 12 / 16 / 20 / 24" name="Spacing scale" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); font-family: var(--font-mono); color: var(--text-faint); padding: 26px; }
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; gap: 8px; align-items: center; }
  .bar { width: 22px; background: var(--accent); border-radius: 3px; }
  .lab { font-size: 10px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height: var(--space-2);"></div><span class="lab">8</span></div>
    <div class="item"><div class="bar" style="height: var(--space-3);"></div><span class="lab">12</span></div>
    <div class="item"><div class="bar" style="height: var(--space-4);"></div><span class="lab">16</span></div>
    <div class="item"><div class="bar" style="height: var(--space-5);"></div><span class="lab">20</span></div>
    <div class="item"><div class="bar" style="height: var(--space-6);"></div><span class="lab">24</span></div>
    <div class="item"><div class="bar" style="height: var(--space-7);"></div><span class="lab">32</span></div>
    <div class="item"><div class="bar" style="height: var(--space-8);"></div><span class="lab">40</span></div>
    <div class="item"><div class="bar" style="height: var(--space-9);"></div><span class="lab">56</span></div>
  </div>
</body>
</html>
