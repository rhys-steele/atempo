<!-- @dsCard group="Colors" viewport="700x190" subtitle="Espresso ground + cream foreground ramp" name="Ground & cream ramp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); font-family: var(--font-mono); color: var(--text-muted); padding: 24px; }
  .row { display: flex; gap: 8px; }
  .sw { flex: 1; height: 64px; border-radius: 8px; border: 1px solid var(--line-08); display: flex; align-items: flex-end; padding: 7px; box-sizing: border-box; }
  .lab { font-size: 9.5px; letter-spacing: 0.04em; }
  .cap { display: flex; justify-content: space-between; margin-top: 10px; font-size: 10px; letter-spacing: 0.16em; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="row" style="margin-bottom: 8px;">
    <div class="sw" style="background: var(--espresso-1000);"><span class="lab" style="color:#f2e9dd;">1000</span></div>
    <div class="sw" style="background: var(--espresso-900);"><span class="lab" style="color:#f2e9dd;">900</span></div>
    <div class="sw" style="background: var(--espresso-850);"><span class="lab" style="color:#f2e9dd;">850</span></div>
    <div class="sw" style="background: var(--espresso-800);"><span class="lab" style="color:#f2e9dd;">800</span></div>
    <div class="sw" style="background: var(--espresso-750);"><span class="lab" style="color:#f2e9dd;">750</span></div>
  </div>
  <div class="row">
    <div class="sw" style="background: var(--cream-50);"><span class="lab" style="color:#16110d;">50</span></div>
    <div class="sw" style="background: var(--cream-100);"><span class="lab" style="color:#16110d;">100</span></div>
    <div class="sw" style="background: var(--cream-200);"><span class="lab" style="color:#16110d;">200</span></div>
    <div class="sw" style="background: var(--cream-300);"><span class="lab" style="color:#16110d;">300</span></div>
    <div class="sw" style="background: var(--cream-400);"><span class="lab" style="color:#16110d;">400</span></div>
    <div class="sw" style="background: var(--cream-500);"><span class="lab" style="color:#16110d;">500</span></div>
    <div class="sw" style="background: var(--cream-600);"><span class="lab" style="color:#f2e9dd;">600</span></div>
    <div class="sw" style="background: var(--cream-700);"><span class="lab" style="color:#f2e9dd;">700</span></div>
    <div class="sw" style="background: var(--cream-800);"><span class="lab" style="color:#f2e9dd;">800</span></div>
  </div>
  <div class="cap"><span>ESPRESSO — GROUND</span><span>CREAM — FOREGROUND RAMP</span></div>
</body>
</html>
