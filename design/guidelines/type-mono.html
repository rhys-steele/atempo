<!-- @dsCard group="Type" viewport="700x210" subtitle="JetBrains Mono — paths, ports, branches, commands, labels" name="Mono — the machine" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--canvas); color: var(--text-muted); padding: 26px; font-family: var(--font-mono); }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .label { font-size: 11px; letter-spacing: 0.16em; color: var(--text-muted); }
  .line { font-size: 12.5px; color: var(--text-body); }
  .cmd { font-size: 14px; color: var(--text-emphasis); }
  .tk { color: var(--accent); }
  .amber { color: var(--signal-attention); }
</style>
</head>
<body>
  <div class="stack">
    <div class="label">WHERE YOU LEFT OFF · NEXT BEAT · LAUNCH RAMP</div>
    <div class="line">feat/captions · "stream search matches" · 2h · <span class="amber">2 uncommitted</span></div>
    <div class="line">~/dev/atlas · <span class="tk">:4100</span> <span class="tk">:1420</span> · postgres:16 ✓ up</div>
    <div class="cmd">$ atempo run atlas</div>
  </div>
</body>
</html>
